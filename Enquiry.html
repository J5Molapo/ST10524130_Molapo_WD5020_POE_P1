<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enquiry</title>
    <link rel="stylesheet" href="CSS/style.css">
  </head>
  <body>
    <header class="site-header">
      <nav class="main-nav" aria-label="Main navigation">
        <a class="brand" href="Index.html" aria-label="Trailblazer home">
          <img src="Images_Resources/TrailBlazer Logo.png" alt="TrailBlazer Logo" />

        <div class="nav-links">
          <a href="Index.html">Home</a>

          <a href="Enquiry.html">Enquiry</a>
          <a href="Contact.html">Contact</a>
        </div>
      </nav>
    </header>
    <main>
      <h1>Enquiry</h1>
      <p>If you have questions about memberships, training, or events, send us an enquiry and we will respond shortly.</p>
      <form action="#" method="post">
        <label for="name">Name</label><br>
        <input id="name" name="name" type="text" required><br>
        <label for="email">Email</label><br>
        <input id="email" name="email" type="email" required><br>
        <label for="phone">Phone</label><br>
        <input id="phone" name="phone" type="tel" placeholder="Optional"><br>
        <label for="subject">Subject</label><br>
        <input id="subject" name="subject" type="text" required><br>
        <label for="message">Message</label><br>
        <textarea id="message" name="message" rows="6" required></textarea><br>
        <button type="submit">Send Enquiry</button>
      </form>
    </main>
    <footer>
      <p>&copy; 2026</p>
    </footer>
  </body>
</html>
